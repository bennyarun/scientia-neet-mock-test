
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SCIENTIA NEET Mock Test</title>
  <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body>
  <header>
    <div class="brand">
      <div class="mark">S<span>✦</span></div>
      <div>
        <strong>SCIENTIA</strong>
        <small>Strong Concepts • Strong Results</small>
      </div>
    </div>
    <nav>
      <a href="{{url_for('home')}}">Home</a>
      <a href="{{url_for('admin_login')}}">Teacher Login</a>
    </nav>
  </header>

  <main>
    {% with msgs=get_flashed_messages() %}
      {% for m in msgs %}
        <p class="alert">{{m}}</p>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer>
    SCIENTIA • NEET (UG) India Mock Examination • Practice portal
  </footer>
</body>
</html>
